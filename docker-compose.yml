services:
  app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    ports:
      - "4443:4443"
    volumes:
      - ./data:/data
    mem_limit: 320m

  proxy:
    image: tesla/vehicle-command:0.4.1
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - TESLA_HTTP_PROXY_TLS_CERT=/config/proxy/tls-cert.pem
      - TESLA_HTTP_PROXY_TLS_KEY=/config/proxy/tls-key.pem
      - TESLA_HTTP_PROXY_HOST=0.0.0.0
      - TESLA_HTTP_PROXY_PORT=4443
      - TESLA_HTTP_PROXY_TIMEOUT=30s
      - TESLA_KEY_FILE=/config/fleet-key.pem
    volumes:
      - ./data/proxy:/config/proxy:ro
      - ./data/tesla-private-key.pem:/config/fleet-key.pem:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    depends_on:
      - app

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
